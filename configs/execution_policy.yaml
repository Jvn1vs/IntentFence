  - "claim_codex_label_review_as_independent_human_verification"
  - "apply_codex_only_review_as_human_verified"
  - "claim_ai_review_as_independent_human_verification"
  - "apply_ai_only_review_as_human_verified"
  - "access_formal_final_test_model_results_before_the_frozen_test_stage"
  - "rent_gpu_or_incur_paid_api_or_training_cost_without_explicit_stage_approval"
project_owner_executes:
  - "new_source_license_or_terms_approval"
  - "independent_human_label_review_signoff"
  - "review_and_approve_each_training_command_before_execution"
  - "tiny_overfit_and_model_parameter_updates"
  - "ai_route_risk_acceptance_and_training_authorization"
  - "confirm_each_owner_approved_training_run_command"
requires_separate_stage_confirmation:
  - "large_new_data_or_model_download"
  - "calibration_or_threshold_fitting"
  - "formal_final_test_model_evaluation"
  - "ai_reviewed_engineering_training_authorization"
  - "paid_api_gpu_or_training_cost"
