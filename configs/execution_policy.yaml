  scope: "data_and_engineering_stage_transitions"
  requires_repeated_confirmation: false
  supersedes_historical_stage_stop_notices: true
codex_allowed:
  - "implement_framework_code_and_configuration"
  - "run_static_lint_unit_tests_and_synthetic_fixture_tests"
  - "preview_commands_without_external_or_data_side_effects"
  - "execute_preapproved_pinned_source_downloads"
  - "convert_merge_deduplicate_and_split_real_project_data"
  - "inspect_and_pre_review_real_project_data_with_truthful_reviewer_provenance"
  - "generate_data_quality_integrity_and_reproducibility_reports"
  - "analyze_logs_manifests_metrics_and_checkpoints_supplied_by_project_owner"
  - "produce_and_validate_dual_ai_training_evidence_under_route_2_2"
  - "build_ai_engineering_readiness_without_formal_training_authorization"
codex_prohibited:
  # Current AGENTS.md reserves every learned-parameter update to the owner.
  - "run_small_or_base_model_training_or_tiny_overfit"
  - "fit_tfidf_or_any_other_learned_baseline_on_real_project_data"
  - "run_training_without_pre_run_command_review"
