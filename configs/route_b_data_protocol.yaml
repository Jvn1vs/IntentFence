schema_version: 1
protocol_version: "2.0.0-draft.2"
status: "direction_approved_construction_authorized_not_frozen"
selected_route: "B"
selected_by: "project_owner"
selected_at: "2026-08-24"
direction_approved_by: "project_owner"
direction_approved_at: "2026-08-24"
project_owned_mock_corpus_authorized: true
unapproved_cc_by_sa_and_noncommercial_sources_excluded: true
evidence_cutoff: "2026-08-24"

risk_labels:
  - "benign"
  - "instruction_hijacking"
  - "data_exfiltration"
  - "privilege_escalation"
  - "tool_manipulation"

task_alignment_labels:
  - "aligned"
  - "unrelated"
  - "ambiguous"
  - "malicious"

legacy_alignment_label:
  field: "alignment_label"
  status: "v1_compatibility_only"
  allowed_as_route_b_training_target: false

action_evidence:
  required_fields:
    - "proposed_action"
    - "action_provenance"
    - "action_observation_id"
    - "action_policy_id"
    - "field_provenance"
  allowed_internal_provenance:
    - "sandbox_policy_output"
    - "source_field"
  prohibited_internal_provenance:
    - "benchmark_target"
    - "protocol_wrapper"
    - "missing"
    - "unknown"
  runtime: "offline_mock_only"
  real_external_side_effects: false

source_routing:
  project_mock_scenarios:
    roles: ["train", "validation", "calibration", "test_a"]
    status: "preferred_pending_independent_human_audit"
  bipia_email_train:
    roles: ["train", "validation", "calibration"]
    status: "eligible_existing_source_pending_v2_reconstruction"
  bipia_table_train:
    roles: []
    status: "excluded_pending_project_owner_cc_by_sa_approval"
  bipia_code_train:
    roles: []
    status: "excluded_pending_project_owner_cc_by_sa_approval"
  bipia_webqa_and_summarization:
    roles: []
    status: "excluded_new_source_terms_not_approved"
  injecagent:
    roles: ["test_b"]
    status: "locked_evaluation_only"
  notinject:
    roles: ["test_c"]
    status: "locked_evaluation_only"
  agentdojo_v0_1_35:
    roles: ["test_d"]
    status: "optional_locked_evaluation_only"
  secalign_and_struq:
    roles: []
    status: "excluded_noncommercial_or_separate_evaluation_only"

split_isolation:
  grouping_keys:
    - "scenario_family"
    - "goal_template"
    - "attack_template"
    - "action_template"
    - "normalized_action_signature"
  exact_cross_role_duplicates: 0
  near_cross_role_duplicates: 0
  near_duplicate_threshold: 0.92
  template_groups_crossing_roles: 0
  frozen_tests_used_for_design: false

audit:
  independent_human_reviewers_required: 2
  both_reviewers_label_same_risk_sample_independently: true
  both_reviewers_label_same_alignment_sample_independently: true
  risk_review_blinded_to_seed_label_and_other_reviewer: true
  alignment_review_blinded_to_risk_seed_label_and_other_reviewer: true
  adjudication_preserves_raw_reviews: true
  ai_review_counts_as_independent_human_review: false
  report_raw_agreement: true
  report_per_class_confusion: true
  sample_rows:
    risk: 400
    alignment: 400
  preregistered_quality_gates:
    completed_fraction_minimum: 0.95
    raw_interreviewer_agreement_minimum: 0.90
    cohen_kappa_minimum: 0.80
    per_seed_class_agreement_minimum: 0.90
    action_realism_realistic_fraction_minimum: 0.95
    failed_gate_action: "revise_corpus_and_generate_new_candidate_do_not_override"

sample_size:
  status: "candidate_target_met_pending_human_audit_and_protocol_freeze"
  basis:
    target_benign_fpr: 0.01
    calibration_benign_rows: 2000
    test_a_benign_rows: 2000
    one_event_resolution: 0.0005
    nominal_wilson_95_half_width_at_1pct: 0.00445658529126125
    caveat: "row-level precision only; cluster-aware uncertainty remains mandatory"
  construction:
    rows_per_base_case: 20
    base_cases:
      train: 250
      validation: 100
      calibration: 500
      test_a: 500
    template_groups:
      train: 50
      validation: 20
      calibration: 100
      test_a: 100
    expected_rows:
      train: 5000
      validation: 2000
      calibration: 10000
      test_a: 10000

readiness:
  formal_training_authorized: false
  public_aggregate_reports_complete: false
  requires:
    - "protocol_2_0_0_approved_and_frozen"
    - "all_source_terms_and_attribution_approved"
    - "five_class_risk_support_gate_passed"
    - "four_class_alignment_support_and_independence_gate_passed"
    - "action_provenance_and_mock_trace_gate_passed"
    - "independent_human_audit_and_adjudication_complete"
    - "split_and_test_lock_integrity_passed"
    - "v2_manifest_and_public_aggregate_reports_complete"
