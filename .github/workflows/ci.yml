name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[data,dev]"
      - run: python scripts/audit_public_release.py --include-untracked
      - run: python scripts/check_release_readiness.py --ref HEAD
      - run: python -m ruff check .
      - run: python -m pytest --cov=intentfence --cov-report=term-missing
      - run: python -m compileall -q src baselines benchmarks scripts deployment
      - run: python -m pip check
      - run: python -m build --wheel
