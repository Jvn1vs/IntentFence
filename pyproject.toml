[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "intentfence"
version = "0.1.0"
description = "A lightweight, calibrated, action-aware indirect prompt-injection gate for LLM agents"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "IntentFence contributors" }]
keywords = ["llm-security", "prompt-injection", "agents", "deberta", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.12,<2",
  "starlette>=0.40,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
data = [
  "huggingface-hub>=0.27,<2",
  "jsonlines>=4.0,<5",
  "nltk>=3.9,<4",
  "pandas>=2.2,<4",
  "pyarrow>=18,<25",
  "transformers>=4.45,<5",
]
ml = [
  "accelerate>=1.0,<2",
  "datasets>=3.0,<5",
  "protobuf>=5,<7",
  "sentencepiece>=0.2,<1",
  "torch>=2.6,<3",
  "transformers>=4.45,<5",
]
onnx = [
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
]
dev = [
  "build>=1.2,<2",
  "hatchling>=1.27,<2",
  "httpx>=0.27,<1",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]
[project.scripts]
intentfence-api = "intentfence.api:run"
intentfence-train = "intentfence.train:main"
intentfence-evaluate = "intentfence.evaluate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/intentfence"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
